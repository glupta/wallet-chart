<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wallet Infrastructure — UX vs Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: #0d0d0d;
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 24px 48px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  h1 {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.4px;
    color: #fff;
    margin-bottom: 5px;
  }
  .subtitle {
    font-size: 12px;
    color: #555;
    margin-bottom: 28px;
    letter-spacing: 0.1px;
  }
  .chart-outer {
    position: relative;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    /* display size set via JS */
  }
  #tooltip {
    position: fixed;
    background: rgba(18,18,18,0.97);
    border: 1px solid #2a2a2a;
    border-radius: 10px;
    padding: 11px 15px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    z-index: 100;
    max-width: 230px;
    line-height: 1.55;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
  }
  #tooltip .name { font-weight: 600; font-size: 13px; margin-bottom: 2px; color: #fff; }
  #tooltip .cat  { font-size: 11px; margin-bottom: 8px; font-weight: 500; }
  #tooltip .scores { display: flex; gap: 16px; margin-bottom: 0; }
  #tooltip .score-item { display: flex; flex-direction: column; gap: 2px; }
  #tooltip .score-label { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
  #tooltip .score-val   { font-size: 14px; font-weight: 600; color: #fff; }
  #tooltip .note { color: #888; font-size: 11px; margin-top: 8px; border-top: 1px solid #222; padding-top: 8px; line-height: 1.5; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    margin-top: 22px;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    color: #888;
  }
  .legend-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<h1>Wallet Infrastructure — UX vs Security</h1>
<div class="subtitle">Scores reflect structural properties, not feature count · Hover for detail</div>

<div class="chart-outer" id="chartOuter">
  <canvas id="bg"></canvas>
  <canvas id="chart"></canvas>
</div>

<div class="legend" id="legend"></div>
<div id="tooltip"></div>

<script>
const DPR  = window.devicePixelRatio || 1;
const W    = 800;
const H    = 600;
const PAD  = { top: 44, right: 44, bottom: 60, left: 60 };

const CATEGORIES = {
  hammock:   { label: "Hammock",                color: "#f59e0b", shape: "star" },
  arch_peer: { label: "Architectural Peers",    color: "#06b6d4" },
  multisig:  { label: "On-chain Multisig",      color: "#a78bfa" },
  tee_waas:  { label: "TEE / WaaS",             color: "#fb923c" },
  mpc_op:    { label: "MPC Operators",          color: "#f87171" },
  inst_cust: { label: "Institutional Custodians",color: "#60a5fa" },
  consumer:  { label: "Consumer Wallets",        color: "#4ade80" },
};

const DATA = [
  { name:"Hammock",              cat:"hammock",   ux:8.5, sec:9.0,  note:"PK never assembled; passkey login; on-chain policies. Caveat: Ika validator-set maturity." },
  { name:"Oisy / NFID (ICP)",   cat:"arch_peer", ux:7.5, sec:9.2,  note:"ICP subnet chain-key — arguably stronger trust than Ika today. Wins on security; loses on Solana ecosystem." },
  { name:"Lit Protocol",         cat:"arch_peer", ux:5.0, sec:6.0,  note:"Federated TEE nodes. Better than single TEE, weaker than 2PC-MPC." },
  { name:"Safe (Gnosis)",        cat:"multisig",  ux:2.0, sec:8.5,  note:"Trustless M-of-N but EVM-only, gas per signer, every action = signing round." },
  { name:"Squads",               cat:"multisig",  ux:4.5, sec:8.0,  note:"Solana-only sibling to Safe. Better Solana UX but chain-prisoner." },
  { name:"Privy",                cat:"tee_waas",  ux:9.0, sec:5.0,  note:"Best-in-class consumer onboarding. TEE + Shamir — Privy + AWS still in trust path." },
  { name:"Para (Capsule)",       cat:"tee_waas",  ux:8.0, sec:4.5,  note:"Social-login embedded wallet. MPC + TEE — vendor in path." },
  { name:"Turnkey",              cat:"tee_waas",  ux:7.0, sec:4.0,  note:"Excellent developer API. AWS Nitro + Turnkey policy engine both trusted." },
  { name:"Dfns",                 cat:"tee_waas",  ux:5.0, sec:5.0,  note:"Enterprise WaaS API. MPC WaaS — vendor in trust path." },
  { name:"Fireblocks",           cat:"mpc_op",    ux:6.0, sec:3.5,  note:"Dominant enterprise infra. Operator shards + Intel SGX. WazirX/Liminal pattern." },
  { name:"Copper",               cat:"mpc_op",    ux:5.5, sec:3.5,  note:"Trading-firm favourite. ClearLoop off-exchange settlement. Operator-trust same pattern." },
  { name:"Fordefi",              cat:"mpc_op",    ux:6.5, sec:3.5,  note:"DeFi-flavoured policy engine. Operator shards." },
  { name:"Cobo",                 cat:"mpc_op",    ux:5.0, sec:3.5,  note:"Asia institutional + retail hybrid. MPC + on-chain fallback. Operator-trust." },
  { name:"Anchorage Digital",    cat:"inst_cust", ux:5.0, sec:6.5,  note:"OCC federal bank charter — only one in crypto. Full custodian but regulated." },
  { name:"BitGo",                cat:"inst_cust", ux:5.0, sec:5.5,  note:"Multi-state qualified custodian + Lloyd's insurance. 2-of-3 multisig — BitGo holds 2 keys." },
  { name:"Coinbase Custody",     cat:"inst_cust", ux:6.0, sec:3.0,  note:"Mass-market institutional default. Fully custodial. 2025 insider breach ($400M)." },
  { name:"Fidelity Digital",     cat:"inst_cust", ux:4.0, sec:6.5,  note:"TradFi brand + cold-storage-heavy. Trust Fidelity." },
  { name:"Komainu",              cat:"inst_cust", ux:3.5, sec:6.0,  note:"Nomura / Ledger / CoinShares JV. Cold storage + MPC." },
  { name:"BNY / State Street",   cat:"inst_cust", ux:3.0, sec:6.5,  note:"TradFi giants. Slow, narrow asset coverage but signal-rich." },
  { name:"Zodia / Hex Trust",    cat:"inst_cust", ux:4.0, sec:5.0,  note:"Bank-adjacent regional custodians. Trust the bank." },
  { name:"Bakkt / Gemini",       cat:"inst_cust", ux:5.0, sec:2.5,  note:"Exchange-tied. Operator + counterparty risk concentrated." },
  { name:"Phantom",              cat:"consumer",  ux:9.0, sec:4.0,  note:"Best-in-class consumer UX (SOL + EVM + BTC). EOA — standard self-custody risk." },
  { name:"Coinbase Smart Wallet",cat:"consumer",  ux:8.5, sec:4.5,  note:"Passkey + ERC-4337. EVM-only. Coinbase paymaster in path." },
  { name:"Argent",               cat:"consumer",  ux:6.5, sec:6.0,  note:"Smart-contract wallet with social recovery. EVM-only." },
  { name:"MetaMask",             cat:"consumer",  ux:7.0, sec:2.5,  note:"Ubiquitous EOA. Seed phrase. EVM only." },
  { name:"Ledger",               cat:"consumer",  ux:1.5, sec:9.0,  note:"Secure element cold storage. Device + cable + seed. Not infra — an authenticator." },
  { name:"Web3Auth",             cat:"consumer",  ux:7.5, sec:4.5,  note:"Distributed key gen + social login. Vendor in path." },
];

// ── Canvas setup ──────────────────────────────────────────────────────────
const outer = document.getElementById("chartOuter");
outer.style.width  = W + "px";
outer.style.height = H + "px";

const bgC = document.getElementById("bg");
const fgC = document.getElementById("chart");
[bgC, fgC].forEach(c => {
  c.width  = W * DPR;
  c.height = H * DPR;
  c.style.width  = W + "px";
  c.style.height = H + "px";
});

const bg  = bgC.getContext("2d");
const ctx = fgC.getContext("2d");
bg.scale(DPR, DPR);
ctx.scale(DPR, DPR);

const plotW = W - PAD.left - PAD.right;
const plotH = H - PAD.top  - PAD.bottom;

function toX(ux)  { return PAD.left + ((ux  - 1) / 9) * plotW; }
function toY(sec) { return PAD.top  + (1 - (sec - 1) / 9) * plotH; }

// ── Background ────────────────────────────────────────────────────────────
function drawBg() {
  bg.clearRect(0, 0, W, H);

  const midX = toX(5.5), midY = toY(5.5);

  // Subtle quadrant fills
  const quads = [
    { x:PAD.left, y:PAD.top,  w:midX-PAD.left,    h:midY-PAD.top,       fill:"rgba(139,92,246,0.05)", label:"LOW UX · HIGH SEC",  lx:PAD.left+10, ly:PAD.top+18 },
    { x:midX,     y:PAD.top,  w:W-PAD.right-midX,  h:midY-PAD.top,       fill:"rgba(34,197,94,0.05)",  label:"HIGH UX · HIGH SEC", lx:midX+10,     ly:PAD.top+18 },
    { x:PAD.left, y:midY,     w:midX-PAD.left,     h:H-PAD.bottom-midY,  fill:"rgba(239,68,68,0.04)",  label:"LOW UX · LOW SEC",   lx:PAD.left+10, ly:H-PAD.bottom-12 },
    { x:midX,     y:midY,     w:W-PAD.right-midX,  h:H-PAD.bottom-midY,  fill:"rgba(245,158,11,0.04)", label:"HIGH UX · LOW SEC",  lx:midX+10,     ly:H-PAD.bottom-12 },
  ];
  quads.forEach(q => {
    bg.fillStyle = q.fill;
    bg.fillRect(q.x, q.y, q.w, q.h);
  });

  // Grid lines
  bg.strokeStyle = "rgba(255,255,255,0.04)";
  bg.lineWidth = 1;
  for (let v = 2; v <= 10; v++) {
    const x = toX(v - 0.5);
    bg.beginPath(); bg.moveTo(x, PAD.top); bg.lineTo(x, H - PAD.bottom); bg.stroke();
    const y = toY(v - 0.5);
    bg.beginPath(); bg.moveTo(PAD.left, y); bg.lineTo(W - PAD.right, y); bg.stroke();
  }

  // Mid dividers
  bg.strokeStyle = "rgba(255,255,255,0.1)";
  bg.lineWidth = 1;
  bg.setLineDash([4, 5]);
  bg.beginPath(); bg.moveTo(midX, PAD.top); bg.lineTo(midX, H - PAD.bottom); bg.stroke();
  bg.beginPath(); bg.moveTo(PAD.left, midY); bg.lineTo(W - PAD.right, midY); bg.stroke();
  bg.setLineDash([]);

  // Quadrant labels
  bg.fillStyle = "rgba(255,255,255,0.13)";
  bg.font = "500 9px 'Inter', sans-serif";
  bg.textAlign = "left";
  quads.forEach(q => {
    bg.fillText(q.label, q.lx, q.ly);
  });

  // Border
  bg.strokeStyle = "rgba(255,255,255,0.08)";
  bg.lineWidth = 1;
  bg.strokeRect(PAD.left, PAD.top, plotW, plotH);

  // Tick labels
  bg.fillStyle = "rgba(255,255,255,0.3)";
  bg.font = "400 10px 'Inter', sans-serif";
  for (let v = 2; v <= 10; v += 2) {
    bg.textAlign = "center";
    bg.fillText(v, toX(v - 0.5), H - PAD.bottom + 18);
    bg.textAlign = "right";
    bg.fillText(v, PAD.left - 10, toY(v - 0.5) + 4);
  }

  // Axis labels
  bg.fillStyle = "rgba(255,255,255,0.35)";
  bg.font = "500 10.5px 'Inter', sans-serif";
  bg.textAlign = "center";
  bg.letterSpacing = "0.8px";
  bg.fillText("UX  →", PAD.left + plotW / 2, H - 10);
  bg.save();
  bg.translate(16, PAD.top + plotH / 2);
  bg.rotate(-Math.PI / 2);
  bg.fillText("SECURITY  →", 0, 0);
  bg.restore();
  bg.letterSpacing = "0px";
}

// ── Dots ──────────────────────────────────────────────────────────────────
const R = 6.5;

function drawStar(cx, cy, r, color) {
  const spikes = 5, outerR = r * 1.8, innerR = r * 0.72;
  let rot = (Math.PI / 2) * 3, step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR); rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR); rot += step;
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.7)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawDot(cx, cy, r, color) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.18)";
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawAll() {
  ctx.clearRect(0, 0, W, H);
  DATA.forEach(d => {
    const cx = toX(d.ux), cy = toY(d.sec);
    const cat = CATEGORIES[d.cat];
    if (d.cat === "hammock") {
      const grd = ctx.createRadialGradient(cx, cy, 2, cx, cy, 22);
      grd.addColorStop(0, "rgba(245,158,11,0.45)");
      grd.addColorStop(1, "rgba(245,158,11,0)");
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(cx, cy, 22, 0, Math.PI * 2); ctx.fill();
      drawStar(cx, cy, R + 3, cat.color);
    } else {
      drawDot(cx, cy, R, cat.color + "cc");
    }
  });
}

// ── Labels (non-overlapping nudge) ────────────────────────────────────────
function drawLabels() {
  ctx.font = "400 10px 'Inter', sans-serif";

  // Pre-compute positions
  const positions = DATA.map(d => {
    const cx = toX(d.ux), cy = toY(d.sec);
    const isHammock = d.cat === "hammock";
    const offset = isHammock ? 16 : 10;
    // Default: right-aligned; flip left if near right edge
    let lx = cx + offset;
    let align = "left";
    const textW = ctx.measureText(d.name).width;
    if (lx + textW > W - PAD.right + 10) { lx = cx - offset; align = "right"; }
    let ly = cy - 3;
    // Nudge up/down if near top/bottom
    if (ly < PAD.top + 10) ly = cy + 14;
    return { d, cx, cy, lx, ly, align, isHammock };
  });

  // Draw backdrop + text
  positions.forEach(({ d, lx, ly, align, isHammock }) => {
    const cat = CATEGORIES[d.cat];
    ctx.font = isHammock ? "600 11px 'Inter', sans-serif" : "400 10px 'Inter', sans-serif";
    ctx.textAlign = align;
    const tw = ctx.measureText(d.name).width;
    const bx = align === "left" ? lx - 3 : lx - tw - 3;

    // Pill backdrop
    ctx.fillStyle = "rgba(13,13,13,0.72)";
    ctx.beginPath();
    ctx.roundRect(bx, ly - 10, tw + 6, 14, 3);
    ctx.fill();

    ctx.fillStyle = isHammock ? "#f59e0b" : cat.color + "e0";
    ctx.fillText(d.name, lx, ly);
  });
}

// ── Tooltip ───────────────────────────────────────────────────────────────
const tip = document.getElementById("tooltip");

fgC.addEventListener("mousemove", e => {
  const rect = fgC.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top)  * scaleY;

  let closest = null, minDist = 22;
  DATA.forEach(d => {
    const dx = toX(d.ux) - mx, dy = toY(d.sec) - my;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < minDist) { minDist = dist; closest = d; }
  });

  if (closest) {
    tip.style.display = "block";
    tip.style.left = (e.clientX + 16) + "px";
    tip.style.top  = (e.clientY - 12) + "px";
    const cat = CATEGORIES[closest.cat];
    tip.innerHTML = `
      <div class="name">${closest.name}</div>
      <div class="cat" style="color:${cat.color}">${cat.label}</div>
      <div class="scores">
        <div class="score-item"><span class="score-label">UX</span><span class="score-val">${closest.ux}</span></div>
        <div class="score-item"><span class="score-label">Security</span><span class="score-val">${closest.sec}</span></div>
      </div>
      ${closest.note ? `<div class="note">${closest.note}</div>` : ""}
    `;
  } else {
    tip.style.display = "none";
  }
});
fgC.addEventListener("mouseleave", () => tip.style.display = "none");

// ── Legend ────────────────────────────────────────────────────────────────
const legendEl = document.getElementById("legend");
Object.entries(CATEGORIES).forEach(([, cat]) => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-dot" style="background:${cat.color}"></div><span>${cat.label}</span>`;
  legendEl.appendChild(item);
});

// ── Render ────────────────────────────────────────────────────────────────
drawBg();
drawAll();
drawLabels();
</script>
</body>
</html>

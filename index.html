<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wallet Solutions — UX vs Security</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    background: #0f0f0f;
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 24px;
    min-height: 100vh;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
    margin-bottom: 4px;
    color: #fff;
  }
  .subtitle {
    font-size: 12px;
    color: #666;
    margin-bottom: 24px;
  }
  .chart-wrap {
    position: relative;
    width: 760px;
    height: 580px;
  }
  canvas { position: absolute; top: 0; left: 0; width: 760px; height: 580px; }

  /* Quadrant labels */
  .quad-label {
    position: absolute;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    opacity: 0.28;
    pointer-events: none;
  }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    pointer-events: none;
    display: none;
    z-index: 100;
    max-width: 220px;
    line-height: 1.5;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  #tooltip .name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  #tooltip .cat { color: #888; font-size: 11px; margin-bottom: 6px; }
  #tooltip .scores { display: flex; gap: 12px; }
  #tooltip .score-item { display: flex; flex-direction: column; }
  #tooltip .score-label { font-size: 10px; color: #666; }
  #tooltip .score-val { font-size: 13px; font-weight: 600; }
  #tooltip .note { color: #aaa; font-size: 11px; margin-top: 6px; border-top: 1px solid #2a2a2a; padding-top: 6px; }

  /* Legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 20px;
    margin-top: 20px;
    justify-content: center;
    max-width: 760px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: #aaa;
  }
  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .axis-label {
    position: absolute;
    font-size: 11px;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 500;
  }
</style>
</head>
<body>

<h1>Wallet Infrastructure — UX vs Security</h1>
<div class="subtitle">Scores reflect structural properties, not feature count. Hover for detail.</div>

<div class="chart-wrap" id="chartWrap">
  <canvas id="bg"></canvas>
  <canvas id="chart"></canvas>
</div>

<div class="legend" id="legend"></div>
<div id="tooltip"></div>

<script>
const PAD = { top: 36, right: 36, bottom: 52, left: 52 };

const CATEGORIES = {
  hammock:      { label: "Hammock",               color: "#f59e0b", shape: "star" },
  arch_peer:    { label: "Architectural Peers",    color: "#06b6d4" },
  multisig:     { label: "On-chain Multisig",      color: "#8b5cf6" },
  tee_waas:     { label: "TEE / WaaS",             color: "#f97316" },
  mpc_op:       { label: "MPC Operators",          color: "#ef4444" },
  inst_cust:    { label: "Institutional Custodians",color: "#3b82f6" },
  consumer:     { label: "Consumer Wallets",        color: "#22c55e" },
};

// UX: passkey/seed, onboarding friction, chain coverage in one surface, policy UX
// Security: operator in signing path? key assembled? trustless? insurance/regulation
const DATA = [
  // ── Hammock ───────────────────────────────────────────────────────────
  { name:"Hammock", cat:"hammock", ux:8.5, sec:9.0,
    note:"PK never assembled; passkey login; on-chain policies. Caveat: Ika validator-set maturity." },

  // ── Architectural Peers ───────────────────────────────────────────────
  { name:"Oisy / NFID (ICP)", cat:"arch_peer", ux:7.5, sec:9.2,
    note:"ICP subnet chain-key — arguably stronger trust than Ika today. Wins on security; loses on Solana ecosystem." },
  { name:"Lit Protocol", cat:"arch_peer", ux:5.0, sec:6.0,
    note:"Federated TEE nodes. Better than single TEE, weaker than 2PC-MPC." },

  // ── On-chain Multisig ─────────────────────────────────────────────────
  { name:"Safe (Gnosis)", cat:"multisig", ux:2.0, sec:8.5,
    note:"Trustless M-of-N but EVM-only, gas per signer, every action = signing round." },
  { name:"Squads", cat:"multisig", ux:4.5, sec:8.0,
    note:"Solana-only sibling to Safe. Better Solana UX but chain-prisoner." },

  // ── TEE / WaaS ────────────────────────────────────────────────────────
  { name:"Privy", cat:"tee_waas", ux:9.0, sec:5.0,
    note:"Best-in-class consumer onboarding. TEE + Shamir — Privy + AWS still in trust path." },
  { name:"Para (Capsule)", cat:"tee_waas", ux:8.0, sec:4.5,
    note:"Social-login embedded wallet. MPC + TEE — vendor in path." },
  { name:"Turnkey", cat:"tee_waas", ux:7.0, sec:4.0,
    note:"Excellent developer API. AWS Nitro + Turnkey policy engine both trusted." },
  { name:"Dfns", cat:"tee_waas", ux:5.0, sec:5.0,
    note:"Enterprise WaaS API. MPC WaaS — vendor in trust path." },

  // ── MPC Operators ─────────────────────────────────────────────────────
  { name:"Fireblocks", cat:"mpc_op", ux:6.0, sec:3.5,
    note:"Dominant enterprise infra. Operator shards + Intel SGX. WazirX/Liminal pattern." },
  { name:"Copper", cat:"mpc_op", ux:5.5, sec:3.5,
    note:"Trading-firm favourite. ClearLoop off-exchange settlement. Operator-trust same pattern." },
  { name:"Fordefi", cat:"mpc_op", ux:6.5, sec:3.5,
    note:"DeFi-flavoured policy engine. Operator shards." },
  { name:"Cobo", cat:"mpc_op", ux:5.0, sec:3.5,
    note:"Asia institutional + retail hybrid. MPC + on-chain fallback. Operator-trust." },

  // ── Institutional Custodians ──────────────────────────────────────────
  { name:"Anchorage Digital", cat:"inst_cust", ux:5.0, sec:6.5,
    note:"OCC federal bank charter — only one in crypto. Full custodian but regulated." },
  { name:"BitGo", cat:"inst_cust", ux:5.0, sec:5.5,
    note:"Multi-state qualified custodian + Lloyd's insurance. 2-of-3 multisig — BitGo holds 2 keys." },
  { name:"Coinbase Custody", cat:"inst_cust", ux:6.0, sec:3.0,
    note:"Mass-market institutional default. Fully custodial. 2025 insider breach ($400M)." },
  { name:"Fidelity Digital", cat:"inst_cust", ux:4.0, sec:6.5,
    note:"TradFi brand + cold-storage-heavy. Trust Fidelity." },
  { name:"Komainu", cat:"inst_cust", ux:3.5, sec:6.0,
    note:"Nomura / Ledger / CoinShares JV. Cold storage + MPC." },
  { name:"BNY / State Street", cat:"inst_cust", ux:3.0, sec:6.5,
    note:"TradFi giants. Slow, narrow asset coverage but signal-rich." },
  { name:"Zodia / Hex Trust", cat:"inst_cust", ux:4.0, sec:5.0,
    note:"Bank-adjacent regional custodians. Trust the bank." },
  { name:"Bakkt / Gemini", cat:"inst_cust", ux:5.0, sec:2.5,
    note:"Exchange-tied. Operator + counterparty risk concentrated." },

  // ── Consumer Wallets ──────────────────────────────────────────────────
  { name:"Phantom", cat:"consumer", ux:9.0, sec:4.0,
    note:"Best-in-class consumer UX (SOL + EVM + BTC). EOA — standard self-custody risk." },
  { name:"Coinbase Smart Wallet", cat:"consumer", ux:8.5, sec:4.5,
    note:"Passkey + ERC-4337. EVM-only. Coinbase paymaster in path." },
  { name:"Argent", cat:"consumer", ux:6.5, sec:6.0,
    note:"Smart-contract wallet with social recovery. EVM-only." },
  { name:"MetaMask", cat:"consumer", ux:7.0, sec:2.5,
    note:"Ubiquitous EOA. Seed phrase. EVM only." },
  { name:"Ledger", cat:"consumer", ux:1.5, sec:9.0,
    note:"Secure element cold storage. Device + cable + seed. Not infra — an authenticator." },
  { name:"Web3Auth", cat:"consumer", ux:7.5, sec:4.5,
    note:"Distributed key gen + social login. Vendor in path." },
];

// ─── Setup ────────────────────────────────────────────────────────────────
const W = 760, H = 580;
const bgC = document.getElementById("bg");
const fgC = document.getElementById("chart");
[bgC, fgC].forEach(c => { c.width = W; c.height = H; });
const bg = bgC.getContext("2d");
const ctx = fgC.getContext("2d");

const plotW = W - PAD.left - PAD.right;
const plotH = H - PAD.top - PAD.bottom;

function toX(ux)  { return PAD.left  + ((ux  - 1) / 9) * plotW; }
function toY(sec) { return PAD.top   + (1 - (sec - 1) / 9) * plotH; }

// ─── Background & grid ────────────────────────────────────────────────────
function drawBg() {
  bg.clearRect(0, 0, W, H);

  // Quadrant fills
  const midX = toX(5.5), midY = toY(5.5);
  const quads = [
    { x: PAD.left, y: PAD.top,  w: midX-PAD.left,   h: midY-PAD.top,   fill:"rgba(139,92,246,0.04)", label:"Low UX · High Security", lx:PAD.left+8, ly:PAD.top+14 },
    { x: midX,     y: PAD.top,  w: W-PAD.right-midX, h: midY-PAD.top,   fill:"rgba(34,197,94,0.05)",  label:"High UX · High Security",  lx:midX+8,     ly:PAD.top+14 },
    { x: PAD.left, y: midY,     w: midX-PAD.left,    h: H-PAD.bottom-midY, fill:"rgba(239,68,68,0.04)", label:"Low UX · Low Security",  lx:PAD.left+8, ly:H-PAD.bottom-8 },
    { x: midX,     y: midY,     w: W-PAD.right-midX, h: H-PAD.bottom-midY, fill:"rgba(245,158,11,0.04)", label:"High UX · Low Security", lx:midX+8,     ly:H-PAD.bottom-8 },
  ];
  quads.forEach(q => {
    bg.fillStyle = q.fill;
    bg.fillRect(q.x, q.y, q.w, q.h);
    bg.fillStyle = "rgba(255,255,255,0.14)";
    bg.font = "9px -apple-system, sans-serif";
    bg.letterSpacing = "0.8px";
    bg.fillText(q.label.toUpperCase(), q.lx, q.ly);
  });

  // Grid lines
  bg.strokeStyle = "#1e1e1e";
  bg.lineWidth = 1;
  for (let v = 2; v <= 10; v += 1) {
    const x = toX(v - 0.5);
    bg.beginPath(); bg.moveTo(x, PAD.top); bg.lineTo(x, H - PAD.bottom); bg.stroke();
    const y = toY(v - 0.5);
    bg.beginPath(); bg.moveTo(PAD.left, y); bg.lineTo(W - PAD.right, y); bg.stroke();
  }

  // Mid lines (brighter)
  bg.strokeStyle = "#2a2a2a";
  bg.lineWidth = 1.5;
  bg.beginPath(); bg.moveTo(midX, PAD.top); bg.lineTo(midX, H - PAD.bottom); bg.stroke();
  bg.beginPath(); bg.moveTo(PAD.left, midY); bg.lineTo(W - PAD.right, midY); bg.stroke();

  // Axes
  bg.strokeStyle = "#333";
  bg.lineWidth = 1.5;
  bg.strokeRect(PAD.left, PAD.top, plotW, plotH);

  // Tick labels
  bg.fillStyle = "#555";
  bg.font = "10px -apple-system, sans-serif";
  bg.textAlign = "center";
  for (let v = 2; v <= 10; v += 2) {
    bg.fillText(v, toX(v - 0.5), H - PAD.bottom + 16);
    bg.textAlign = "right";
    bg.fillText(v, PAD.left - 8, toY(v - 0.5) + 3);
    bg.textAlign = "center";
  }

  // Axis labels
  bg.fillStyle = "#555";
  bg.font = "11px -apple-system, sans-serif";
  bg.letterSpacing = "0.6px";
  bg.textAlign = "center";
  bg.fillText("UX  →", PAD.left + plotW / 2, H - 8);

  bg.save();
  bg.translate(14, PAD.top + plotH / 2);
  bg.rotate(-Math.PI / 2);
  bg.fillText("SECURITY  →", 0, 0);
  bg.restore();
}

// ─── Dots ─────────────────────────────────────────────────────────────────
const R = 6;

function drawStar(ctx, cx, cy, r, color) {
  const spikes = 5, outerR = r * 1.7, innerR = r * 0.7;
  let rot = (Math.PI / 2) * 3, step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.6)";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawDot(ctx, cx, cy, r, color) {
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1;
  ctx.stroke();
}

function drawAll() {
  ctx.clearRect(0, 0, W, H);
  DATA.forEach(d => {
    const cx = toX(d.ux), cy = toY(d.sec);
    const cat = CATEGORIES[d.cat];
    if (d.cat === "hammock") {
      // Glow
      const grd = ctx.createRadialGradient(cx, cy, 2, cx, cy, 18);
      grd.addColorStop(0, "rgba(245,158,11,0.5)");
      grd.addColorStop(1, "rgba(245,158,11,0)");
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(cx, cy, 18, 0, Math.PI * 2); ctx.fill();
      drawStar(ctx, cx, cy, R + 3, cat.color);
    } else {
      drawDot(ctx, cx, cy, R, cat.color + "cc");
    }
  });
}

// ─── Labels (smart, non-overlapping) ─────────────────────────────────────
function drawLabels() {
  // Only label Hammock + a curated set to avoid clutter
  const labeled = ["Hammock","Oisy / NFID (ICP)","Safe (Gnosis)","Fireblocks",
                   "Privy","Phantom","Ledger","Coinbase Custody","Anchorage Digital",
                   "Squads","Turnkey","Coinbase Smart Wallet","Coinbase Smart Wallet"];
  DATA.forEach(d => {
    if (!labeled.includes(d.name)) return;
    const cx = toX(d.ux), cy = toY(d.sec);
    ctx.font = d.cat === "hammock" ? "bold 11px -apple-system, sans-serif" : "10px -apple-system, sans-serif";
    ctx.fillStyle = d.cat === "hammock" ? "#f59e0b" : "rgba(255,255,255,0.65)";
    ctx.textAlign = "left";
    const lx = cx + (d.cat === "hammock" ? 14 : 9);
    const ly = cy - 5;
    ctx.fillText(d.name, lx, ly);
  });
}

// ─── Hover ────────────────────────────────────────────────────────────────
const tip = document.getElementById("tooltip");

fgC.addEventListener("mousemove", e => {
  const rect = fgC.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  let closest = null, minDist = 20;
  DATA.forEach(d => {
    const dx = toX(d.ux) - mx, dy = toY(d.sec) - my;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if (dist < minDist) { minDist = dist; closest = d; }
  });

  if (closest) {
    tip.style.display = "block";
    tip.style.left = (e.clientX + 14) + "px";
    tip.style.top  = (e.clientY - 10) + "px";
    const cat = CATEGORIES[closest.cat];
    tip.innerHTML = `
      <div class="name">${closest.name}</div>
      <div class="cat" style="color:${cat.color}">${cat.label}</div>
      <div class="scores">
        <div class="score-item"><span class="score-label">UX</span><span class="score-val">${closest.ux}/10</span></div>
        <div class="score-item"><span class="score-label">Security</span><span class="score-val">${closest.sec}/10</span></div>
      </div>
      ${closest.note ? `<div class="note">${closest.note}</div>` : ""}
    `;
  } else {
    tip.style.display = "none";
  }
});
fgC.addEventListener("mouseleave", () => tip.style.display = "none");

// ─── Legend ───────────────────────────────────────────────────────────────
const legendEl = document.getElementById("legend");
Object.entries(CATEGORIES).forEach(([key, cat]) => {
  const item = document.createElement("div");
  item.className = "legend-item";
  item.innerHTML = `<div class="legend-dot" style="background:${cat.color}"></div><span>${cat.label}</span>`;
  legendEl.appendChild(item);
});

// ─── Render ───────────────────────────────────────────────────────────────
drawBg();
drawAll();
drawLabels();
</script>
</body>
</html>

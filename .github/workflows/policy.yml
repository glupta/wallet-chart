name: Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  invalidate-review:
    name: invalidate-review
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Remove review from a superseded tip
        if: >-
          github.event.action == 'synchronize' &&
          contains(github.event.pull_request.labels.*.name, 'policy-reviewed')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "${PR_URL}" --remove-label policy-reviewed

  policy:
    name: policy
    needs: invalidate-review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful review invalidation
        env:
          INVALIDATION_RESULT: ${{ needs.invalidate-review.result }}
        run: test "${INVALIDATION_RESULT}" = success

      - name: Check out the proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}" "${HEAD_SHA}"

      - name: Require immutable GitHub Action references
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@60e3a74c7b74a319e8e53e46bc455205f7173e1a # v5.0.8

      - name: Scan the proposed commits for secrets
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c # v3.97.4
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          version: 3.97.1
          extra_args: --only-verified

      - name: Require principal policy review
        uses: mheap/github-action-required-labels@23e10fde7e062233401931a0eece796cd9bf3177 # v5.6.0
        with:
          labels: policy-reviewed
          mode: exactly
          count: 1
          add_comment: false
          message: >-
            Apply policy-reviewed only after verifying the owning spec or Issue,
            adoption evidence, zero-custom boundary, simplicity, and fixed tests.

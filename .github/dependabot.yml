version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      actions-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-majors:
        patterns: ["*"]
        update-types: [major]
    open-pull-requests-limit: 5
